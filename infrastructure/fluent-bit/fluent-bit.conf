[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

    Parsers_File ${DNSNETRA_ROOT}/infrastructure/fluent-bit/parsers.conf


#####################################################
# INPUT
#####################################################

[INPUT]
    Name              tail
    Path              ${DNSNETRA_ROOT}/data/samples/logs/query.log
    Tag               dns
    Read_from_Head    True
    Parser            dns_bind_parser


#####################################################
# Preserve original log
#####################################################

[FILTER]
    Name          modify
    Match         dns

    Copy          log raw_log


#####################################################
# OUTPUT
#####################################################

[OUTPUT]
    Name      kafka
    Match     *
    Brokers   localhost:9092
    Topics    dns-logs
    Format    json
